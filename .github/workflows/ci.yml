name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks (JS syntax, manifest, precached assets)
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (layout, robustness, easter egg)
        run: npm test
