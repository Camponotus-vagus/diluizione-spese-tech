name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.56 cannot install Chromium deps on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks (JS syntax, manifest, precached assets)
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (layout, robustness, easter egg)
        run: npm test
